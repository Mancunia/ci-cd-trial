name: Deployment pipeline

on:
  push:
    branches:
      - main

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: echo "Checking out code..."
      - uses: actions/checkout@v6 #this action checks out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - name: Set up Node.js LTS
        run: echo "Setting up Node.js LTS..."
      - uses: actions/setup-node@v6 #this action sets up a Node.js environment for use in actions by adding it to the PATH
        with:
          node-version: '24' # Specify the Node.js version you want to use
      - name: Install dependencies
        run: npm install #this command installs the dependencies defined in your package.json file
      - name: Run linter
        run: npm run eslint #this command runs the linter defined in your package.json file
      - name: Run tests
        run: npm run test #this command runs the tests defined in your package.json file